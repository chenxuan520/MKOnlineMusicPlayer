name: Release APK (Tag)

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-release-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-

      - name: Build Release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK with tag
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          mv android/app/build/outputs/apk/release/app-release.apk \
             android/app/build/outputs/apk/release/MKOnlineMusicPlayer-${TAG}.apk
          echo "APK_NAME=MKOnlineMusicPlayer-${TAG}.apk" >> $GITHUB_ENV

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/${{ env.APK_NAME }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(GITHUB_REF_NAME, 'beta') || contains(GITHUB_REF_NAME, 'alpha') || contains(GITHUB_REF_NAME, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
