<div id="password-overlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #222; z-index: 9999; display: flex; justify-content: center; align-items: center;">
    <div style="text-align: center; background-color: #333; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5);">
        <h2 style="color: #eee; margin-bottom: 20px;">请输入密码</h2>
        <input type="password" id="password-input" placeholder="密码" style="padding: 10px; margin-bottom: 15px; border: 1px solid #555; border-radius: 4px; width: 200px; background-color: #444; color: #eee;">
        <button id="password-submit" style="padding: 10px 20px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer;">进入</button>
        <p id="password-error" style="color: #ff6b6b; margin-top: 10px; display: none;">密码错误，请重试。</p>
    </div>
</div>

<div id="blur-img"></div>

<!-- 头部logo -->
<div class="header">
    <div class="logo" title="Version 3.0; Based on Meting; Powered by chenxuan520">
        <a href="https://github.com/chenxuan520/MKOnlineMusicPlayer" target="_blank">♫ ChenPlayer</a>
    </div>
    <div class="banner_text">
        <a href="javascript:;">
            <img src="images/avatar.png">
            <span>歌曲热评/评论</span>
        </a>
    </div>
</div>  <!--class="header"-->

<!-- 中间主体区域 -->
<div class="center">
    <div class="container">
        <div class="btn-bar">
            <!-- tab按钮区 -->
            <div class="btn-box" id="btn-area">
                <span class="btn" data-action="player" hidden>播放器</span>
                <span class="btn" data-action="playing" title="正在播放列表">正在播放</span>
                <span class="btn" data-action="sheet" title="音乐播放列表">播放列表</span>
                <span class="btn" data-action="search" title="点击搜索音乐">歌曲搜索</span>
                <span class="btn" data-action="collections" title="我的收藏">我的收藏</span>
                <span class="btn btn-settings" data-action="settings" title="设置"><i class="layui-icon layui-icon-set"></i></span>
            </div>
        </div>  <!--class="btn-bar"-->

        <div class="data-area">
            <!--歌曲歌单-->
            <div id="sheet" class="data-box" hidden></div>

            <!--音乐播放列表-->
            <div id="main-list" class="music-list data-box"></div>
        </div>  <!--class="data-area"-->

        <!-- 右侧封面及歌词展示 -->
        <div class="player" id="player">
            <!--歌曲封面-->
            <div class="cover">
                <img src="images/player_cover.png" class="music-cover" id="music-cover">
            </div>
            <!--滚动歌词-->
            <div class="lyric">
                <ul id="lyric"></ul>
            </div>
            <div id="music-info" title="点击查看歌曲信息"></div>
        </div>
    </div>  <!--class="container"-->
</div>  <!--class="center"-->

<!-- 播放器底部区域 -->
<div class="footer">
    <div class="container">
        <div class="con-btn">
            <a href="javascript:;" class="player-btn btn-prev" title="上一首"></a>
            <a href="javascript:;" class="player-btn btn-play" title="暂停/继续"></a>
            <a href="javascript:;" class="player-btn btn-next" title="下一首"></a>
            <a href="javascript:;" class="player-btn btn-order" title="循环控制"></a>
        </div>  <!--class="con-btn"-->

        <div class="vol">
            <div class="quiet">
                <a href="javascript:;" class="player-btn btn-quiet" title="静音"></a>
            </div>
            <div class="volume">
                <div class="volume-box">
                    <div id="volume-progress" class="mkpgb-area"></div>
                </div>
            </div>
        </div>  <!--class="vol"-->

        <div class="progress">
            <div class="progress-box">
                <div id="music-progress" class="mkpgb-area"></div>
                <div class="audio-time">00:00/00:00</div>
            </div>
        </div>  <!--class="progress"-->
    </div>  <!--class="container"-->
</div>  <!--class="footer"-->

<!-- 搜索弹窗 -->
<script type="text/html" id="layer-form-box">
    <div id="layer-form-content">
        <form class="layui-form" onSubmit="return searchSubmit()" action="" id="search-area">
            <div class="search-input">
                <input type="text" name="wd" id="search-wd" required  lay-verify="required" placeholder="搜索歌手、歌名、专辑" autocomplete="on" class="layui-input">
                <button class="layui-btn" lay-submit type="submit">搜 索</button>
            </div>
            <div class="source-radio" id="music-source">
                <label><input type="radio" name="source" value="netease" checked title="网易云"></label>
                <label><input type="radio" name="source" value="kugou" title="酷狗"></label>
                <label><input type="radio" name="source" value="tencent" title="QQ"></label>
                <!--div hidden>致敬永远存在的虾米音乐 start</div>
                <label><input type="radio" name="source" value="xiami" title="虾米" disabled></label>
                <div hidden>end</div-->
            </div>
        </form>
    </div>
</script>

<!-- 公告html -->
<script type="text/html" id="layer-placard-box">
    <ul id="layer-placard-content">
        <li>由于本站歌曲和封面图片较多，所以第一次加载会比较慢，耐心稍等一会就行。</li>
        <li>PC端可使用快捷键控制，Ctrl+左方向键=上一首、Ctrl+右方向键=下一首、空格键=播放/暂停。</li>
        <li>移动端（手机、平板用户）请双击播放，第一次点击是加载，第二点击是播放，为防止误操作。</li>
        <!-- <li>有事可以联系站长QQ&nbsp;<a href="https://wpa.qq.com/msgrd?v=3&uin=2578096874&site=qq&menu=yes" target="_blank" style="color: #72ACE3">2578096874</a>，不经常在线，有事请留言。</li> -->
    </ul>
</script>

<!-- 设置弹窗 -->
<script type="text/html" id="layer-settings-box">
    <div id="layer-settings-content" style="padding: 20px; padding-bottom: 40px; max-height: calc(100vh - 240px); overflow-y: auto;">
        <form class="layui-form" action="">
            <fieldset class="layui-elem-field layui-field-title" style="margin-top: 0;">
                <legend style="font-size: 14px;">基础设置</legend>
            </fieldset>
            <div class="layui-form-item">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <label class="layui-form-label" style="float: none; padding: 9px 0; text-align: left; width: auto;">启动时自动加载列表</label>
                    <div class="layui-input-block" style="margin-left: 0; min-height: auto;">
                        <input type="checkbox" name="auto-load" lay-skin="switch" lay-text="ON|OFF">
                    </div>
                </div>
            </div>

            <div class="layui-form-item">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <label class="layui-form-label" style="float: none; padding: 9px 0; text-align: left; width: auto;">加载全部列表</label>
                    <div class="layui-input-block" style="margin-left: 0; min-height: auto;">
                        <input type="checkbox" name="load-all-sheets" lay-skin="switch" lay-text="ON|OFF">
                    </div>
                </div>
            </div>

            <div class="layui-form-item">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <label class="layui-form-label" style="float: none; padding: 9px 0; text-align: left; width: auto;">只看热门评论</label>
                    <div class="layui-input-block" style="margin-left: 0; min-height: auto;">
                        <input type="checkbox" name="hot-comments-only" lay-skin="switch" lay-text="ON|OFF">
                    </div>
                </div>
            </div>

            <fieldset class="layui-elem-field layui-field-title" style="margin-top: 20px;">
                <legend style="font-size: 14px;">VIP歌曲设置</legend>
            </fieldset>
            <div class="layui-form-item">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <label class="layui-form-label" style="float: none; padding: 9px 0; text-align: left; width: auto;">搜索过滤VIP歌曲</label>
                    <div class="layui-input-block" style="margin-left: 0; min-height: auto;">
                        <input type="checkbox" name="filter-vip" lay-skin="switch" lay-text="ON|OFF">
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <label class="layui-form-label" style="float: none; padding: 9px 0; text-align: left; width: auto;">播放自动跳过VIP歌曲</label>
                    <div class="layui-input-block" style="margin-left: 0; min-height: auto;">
                        <input type="checkbox" name="skip-vip" lay-skin="switch" lay-text="ON|OFF">
                    </div>
                </div>
            </div>

            <fieldset class="layui-elem-field layui-field-title" style="margin-top: 20px;">
                <legend style="font-size: 14px;">背景设置</legend>
            </fieldset>

            <div class="layui-form-item">
                <div class="layui-input-block" style="margin-left: 0;">
                    <input type="radio" name="bg-type" value="default" title="专辑封面" lay-filter="bg-type">
                    <input type="radio" name="bg-type" value="custom" title="自定义图片" lay-filter="bg-type">
                </div>
            </div>

            <div class="layui-form-item" id="bg-custom-input-area" style="display: none;">
                <div style="display: flex; gap: 10px;">
                    <input type="text" name="bg-url" placeholder="请输入图片URL" autocomplete="off" class="layui-input">
                    <button type="button" class="layui-btn layui-btn-normal" id="test-bg-btn">测试</button>
                </div>
                <div class="layui-form-mid layui-word-aux" style="float: none; font-size: 12px;">测试通过后方可保存生效</div>
            </div>

            <fieldset class="layui-elem-field layui-field-title" style="margin-top: 20px;">
                <legend style="font-size: 14px;">推荐服务设置</legend>
            </fieldset>
            <div class="layui-form-item" style="margin-bottom: 10px;">
                <div class="layui-form-mid layui-word-aux" style="float: none; font-size: 12px;">推荐服务部署参考：<a href="https://github.com/chenxuan520/recommend_engine" target="_blank" rel="noopener">chenxuan520/recommend_engine</a></div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label" style="width: 80px; padding: 9px 0; text-align: left;">服务域名</label>
                <div class="layui-input-block" style="margin-left: 90px;">
                    <input type="text" name="recommend-domain" placeholder="例如 http://localhost:8080" autocomplete="off" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label" style="width: 80px; padding: 9px 0; text-align: left;">Token</label>
                <div class="layui-input-block" style="margin-left: 90px;">
                    <div class="token-input-wrapper">
                        <input type="password" name="recommend-token" id="recommend-token-input" placeholder="Bearer Token" autocomplete="off" class="layui-input">
                        <span id="toggle-token-visibility" class="token-eye-icon token-eye-closed token-eye-btn" title="显示/隐藏Token"></span>
                    </div>
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label" style="width: 80px; padding: 9px 0; text-align: left;">参考收藏数</label>
                <div class="layui-input-block" style="margin-left: 90px;">
                    <input type="number" name="recommend-fav-count" placeholder="默认 20" autocomplete="off" class="layui-input" min="1" step="1">
                    <div class="layui-form-mid layui-word-aux" style="float: none; font-size: 12px;">用于个性化推荐：小于收藏总数则随机抽取对应数量；大于等于收藏总数则打乱后全部传递</div>
                </div>
            </div>

            <div class="layui-form-item" style="text-align: center; margin-top: 30px;">
                <button class="layui-btn" lay-submit lay-filter="settings-submit">保存设置</button>
                <button type="button" class="layui-btn layui-btn-primary" onclick="layer.closeAll('page')">取消</button>
            </div>
        </form>
    </div>
</script>

<!-- 评论弹窗 -->
<div id="comment-modal" class="comment-modal">
    <div class="comment-modal-content">
        <div class="comment-modal-header">
            <div class="comment-count">评论 (<span id="current-comment">0</span>/<span id="total-comments">0</span>)</div>
            <div class="comment-nav">
                <button id="prev-comment" class="comment-nav-btn" disabled>上一条</button>
                <button id="next-comment" class="comment-nav-btn" disabled>下一条</button>
                <button id="close-comment" class="comment-nav-btn">关闭</button>
            </div>
        </div>
        <div class="comment-modal-body">
            <div class="comment-item">
                <img id="comment-avatar" class="comment-avatar" src="images/avatar.png" alt="头像">
                <div class="comment-content">
                    <div class="comment-user" id="comment-username">用户名</div>
                    <div class="comment-text" id="comment-content">评论内容</div>
                    <div class="comment-time" id="comment-time">评论时间</div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
